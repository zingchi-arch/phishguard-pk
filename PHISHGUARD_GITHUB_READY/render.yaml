services:
  - type: web
    name: phishguard-pk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn phishguard.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: PHISHGUARD_WHOIS
        value: '0'
      - key: PHISHGUARD_TEXT_BACKEND
        value: classical
